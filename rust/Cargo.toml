[workspace]
resolver = "2"
members = [
    "crates/nahpu_embed_core",
    "crates/nahpu_embed_burn",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nahpu/nahpu-ai"

[workspace.dependencies]
anyhow = "1"
nahpu_embed_core = { path = "crates/nahpu_embed_core" }
nahpu_embed_burn = { path = "crates/nahpu_embed_burn" }
burn = { version = "0.22.0", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif"] }

# Unoptimised tensor kernels make debug runs unusably slow (47x here), while our
# own crates stay debuggable.
[profile.dev.package."*"]
opt-level = 3
# Without debug info, `cargo check` (and rust-analyzer) shares the build
# script's output with `cargo build` instead of importing every model again.
debug = false
